                <li><code>    show(t)</code></li>
              </ol>
                </section>
              </div>
            </div>
            <p class="empty" id="noFiles" hidden>No files open. Pick a file in the tree to edit it.</p>
            <div class="subtabs" role="status" aria-label="File status">
              <span class="state" data-kind="gap" id="fileState">Unsaved changes</span>
            </div>
          </section>

          <section class="half" id="screenHalf" aria-label="Screen">
            <div class="vhead">
              <button class="vtab" type="button" aria-current="page">Screen</button>
              <div class="right">
                <button class="btn sm" type="button" title="Reload the screen"><svg class="ico"><use href="../icons.svg#i-rebuild"/></svg>Reload</button>
                <button class="btn sm" type="button" id="captureBtn" title="Capture a snapshot of the screen">Capture</button>
                <button class="btn sm" type="button" id="exportBtn" title="Export the project">Export</button>
              </div>
            </div>
            <div class="previewbar" role="status"><b>Capture <span class="mono">14:32</span></b><span id="roLine" hidden>Read-only</span><button class="btn sm" type="button" id="pinTool" aria-pressed="true">Pin</button><button class="btn sm" type="button" id="boxTool" aria-pressed="false">Rectangle</button><button class="btn sm" type="button">Back to live</button></div>
            <div class="edmsg" id="screenError" hidden>
              <p class="notice notice--danger"><span>The screen could not be reached.</span></p>
              <div class="acts"><button class="btn sm quiet" type="button">Reload</button></div>
            </div>
            <div class="stage">
              <div class="demo-screen" role="img" aria-label="The thermostat screen, 480 by 320">
                <div class="rowz"><span>Thermostat</span><span>14:32</span></div><div class="big">21.5°</div><div class="rowz"><span class="key">−</span><span>Target 22.0°</span><span class="key">+</span></div>
                <button class="hpin cap" type="button" data-sx="240" data-sy="46" aria-label="Pin 1, the title"><span class="mk">1</span></button>
                <button class="hpin cap" type="button" data-sx="310" data-sy="120" aria-pressed="true" aria-label="Pin 2, the temperature, selected"><span class="mk">2</span></button>
                <button class="hbox" type="button" data-sx="411" data-sy="261" data-sw="53" data-sh="45" aria-label="Rectangle 3, the plus key"></button>
                <button class="hpin cap" type="button" data-sx="411" data-sy="261" aria-label="Number 3, the plus key"><span class="mk">3</span></button>
              </div>
              <span class="hud hud--bl">480 × 320</span>
              <form class="composer" aria-label="Comment on pin 2" data-hide="viewonly">
                <div class="where">Pin 2 at <span class="mono">310, 120</span></div>
                <textarea rows="2" aria-label="Comment">The set point matters more than the clock. Make it the largest thing here.</textarea>
                <div class="acts"><button class="btn sm quiet danger" type="button">Delete pin</button><button class="btn sm quiet" type="button">Cancel</button><button class="btn sm" type="button">Save</button></div>
              </form>
            </div>
            <nav class="subtabs" aria-label="Live screen and captures">
              <button class="subtab" type="button" id="liveTab" aria-current="page">Live</button>
              <button class="subtab" type="button" data-capture data-hide="standalone"><span class="mono">14:32</span></button>
              <button class="subtab" type="button" data-hide="standalone"><span class="mono">14:18</span></button>
              <button class="subtab" type="button" data-hide="standalone"><span class="mono">13:57</span></button>
              <div class="right"><span class="zoom"><button class="btn icon sm" type="button" aria-label="Zoom out"><svg class="ico"><use href="../icons.svg#i-minus"/></svg></button><span class="mono">100%</span><button class="btn icon sm" type="button" aria-label="Zoom in"><svg class="ico"><use href="../icons.svg#i-plus"/></svg></button></span></div>
            </nav>
          </section>

        </div>
      </main>

      <p class="empty connecting" id="connecting" hidden>Connecting to the harness</p>
      <div class="errrow" id="bootError" role="alert" hidden>
        <p class="notice notice--danger"><span>The harness did not answer. Check that it is running.</span></p>
        <button class="btn sm quiet" type="button">Retry</button>
      </div>
      <div id="toast" role="status"></div>
      <div id="err" role="alert"></div>
      <aside class="inspector" id="files" aria-label="Files">
        <div class="ihead"><h2>Files</h2><button class="btn icon sm" type="button" data-panel-close aria-label="Hide the file tree" title="Hide"><svg class="ico"><use href="../icons.svg#i-x"/></svg></button></div>
        <div class="iscroll">
          <ul class="tree" id="fileTree" aria-label="Project files">
            <li><details open><summary><span class="mono">ui</span></summary>
              <ul>
                <li class="file" data-open aria-current="true" data-file="thermostat.py"><span class="mono">thermostat.py</span><span class="lamp warn" role="img" aria-label="Changed by the agent" title="Changed by the agent"></span></li>
                <li class="file" data-open data-file="widgets.py"><span class="mono">widgets.py</span></li>
                <li class="file" data-file="theme.py"><span class="mono">theme.py</span></li>
              </ul></details></li>
            <li><details open><summary><span class="mono">assets</span></summary>
              <ul>
                <li><details open><summary><span class="mono">icons</span></summary>
                  <ul>
                    <li class="file"><span class="mono">flame.png</span></li>
                    <li class="file"><span class="mono">snow.png</span></li>
                  </ul></details></li>
                <li class="file"><span class="mono">font_44.bin</span></li>
              </ul></details></li>
            <li><details><summary><span class="mono">lib</span></summary>
              <ul>
                <li class="file"><span class="mono">sensors.py</span></li>
              </ul></details></li>
            <li class="file" data-open data-file="main.py"><span class="mono">main.py</span></li>
            <li class="file"><span class="mono">boot.py</span></li>
            <li class="tin" id="treeInput" hidden><form id="treeForm"><input class="input mono" id="treeName" type="text" value="widgets.py" spellcheck="false" autocomplete="off" aria-label="New name"></form><p class="hint">Enter renames, Escape cancels</p></li>
            <li class="tin" id="treeConfirm" hidden></li>
          </ul>
          <p class="empty" id="treeEmpty" hidden>No files yet. <button class="linkish" type="button">New file</button></p>
          <p class="empty" id="treeLoading" hidden>Loading files</p>
        </div>
        <span class="menu at" id="ctxMenu" role="menu" aria-label="widgets.py" hidden>
          <button type="button" role="menuitem">Rename</button>
          <button type="button" role="menuitem" class="danger" id="ctxDelete" data-confirm='{"title":"Delete widgets.py?","detail":"The file is removed from the project.","action":"Delete","danger":true}' data-confirm-into="#treeConfirm">Delete</button>
          <hr>
          <button type="button" role="menuitem">New file</button>
          <button type="button" role="menuitem">New folder</button>
          <button type="button" id="ctxForce" hidden data-confirm='{"title":"Delete assets and everything in it","detail":"It holds 3 files.","action":"Delete all","danger":true}' data-confirm-into="#treeConfirm">Delete all</button>
        </span>
      </aside>

      <aside id="chat" aria-label="Agent" data-pending="0">
        <header><h1>Agent</h1><span id="agentStatus" class="agentstatus" data-state="ready">Ready</span>
          <span class="working" role="status"><span class="bar" aria-hidden="true"></span>Working <b id="chatWorkingTime"></b></span>
          <span class="spacer"></span>
          <span id="connIndicator" class="conn" data-state="live">Live</span>
          <button id="sessionStart" type="button" class="hdrbtn primary">Start session</button>
        </header>
        <div id="chatBanner" class="chatbanner" data-kind="info"><span id="chatBannerText">No session yet. Start one to let the agent drive this screen.</span><button id="chatBannerClose" type="button" aria-label="Dismiss">&times;</button></div>
        <div id="chatLog" aria-live="polite"><button class="chathistory" type="button">Beginning of conversation</button></div>
        <div class="side">
          <div id="chatPending"></div>
          <div id="chatComposer">
            <div id="chatAttachStrip" class="attachstrip" hidden></div>
            <div id="chatComposerRow"><input id="chatFileInput" type="file" multiple hidden>
              <button id="chatAttachBtn" type="button" class="attachbtn" aria-label="Attach an image"><svg class="ico"><use href="../icons.svg#i-attach"/></svg></button>
              <textarea data-palette-ignore id="chatInput" rows="2" aria-label="Message" placeholder="Message the agent"></textarea>
              <div class="chatbtns"><button id="chatInterrupt" type="button" disabled>Interrupt</button><button id="chatSend" type="button" class="primary">Send</button></div>
            </div>
          </div>
        </div>
      </aside>
      <template id="chatNone">
        <aside id="chat" aria-label="Agent">
          <header><h1>Agent</h1></header>
          <p class="empty">Standalone Studio has no agent. Open the project through Annealage to work with one.</p>
        </aside>
      </template>

      <footer class="statusbar">
        <span class="conn" data-state="live" id="statusConn">Live</span>
        <span>Harness <span class="ok" id="harnessState">running</span></span>
        <span id="lastError" hidden><span class="state" data-kind="bad">Last error</span><b>ImportError: no module named widgets</b></span>
        <span id="readOnlyNote" hidden>Read-only</span>
        <span id="savedNote" class="push">Saved <b>14:31</b></span>
        <span id="unsavedNote" data-hide="viewonly">Unsaved changes <b>1</b></span>
        <span>Reloads <b>8</b></span>
      </footer>
    </template>

  </div>
</div>
<script src="../frame.js" data-auto></script>
<script src="../palette.js"></script>
<script type="module" src="demo.js"></script>
<script type="module" src="canvas-demo.js"></script>
<script type="module" src="confirm-demo.js"></script>
