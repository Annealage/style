          <div class="iscroll">
            <details class="finding" open>
              <summary><div class="fhead"><span class="sev" data-sev="critical">Critical</span><span class="fid">Q-004</span><span class="fstat" data-status="confirmed">confirmed</span></div>
                <div class="claim">USB D+ and D− have no series resistors; the RP2040 needs 27 Ω on each line.</div>
                <div class="subj"><code>U6.46</code><code>U6.47</code><code>USB_DP</code><code>USB_DM</code></div></summary>
              <div class="fbody">
                <h3>Evidence</h3>
                <ul class="evidence"><li><span class="etype">Datasheet</span><span><button class="linkish" type="button">rp2040-datasheet.pdf p. 12</button>: 27 Ω series termination on DP and DM.</span></li><li><span class="etype">Netlist</span><span>USB_DP: U6.47, J1.A6. No R on net.</span></li></ul>
                <p class="note">R3 and R4 are 27 Ω but sit on the QSPI lines.</p>
                <div class="acts"><button class="btn" type="button">Accept</button><button class="btn quiet" type="button">Dismiss…</button><button class="btn quiet" type="button">Show on sheet</button></div>
              </div>

            <details class="finding">

                <div class="subj"><code>Y1</code><code>C29</code><code>C30</code></div></summary>
            </details>
            <details class="finding" data-triage="accepted">
              <summary><div class="fhead"><span class="sev" data-sev="major">Major</span><span class="fid">Q-009</span><span class="fstat" data-status="confirmed-interpretive">confirmed</span><span class="ftri" data-triage="accepted">accepted</span><span class="fver">erc</span></div>
                <div class="claim">The 1V1 rail has one 100 nF decoupler for two DVDD pins.</div>
                <div class="subj"><code>U6.23</code><code>U6.50</code><code>C38</code></div></summary>
